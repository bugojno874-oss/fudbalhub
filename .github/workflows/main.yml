name: Update football data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get football fixtures
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          mkdir -p data

          curl -s \
            -H "x-apisports-key: $FOOTBALL_API_KEY" \
            "https://v3.football.api-sports.io/fixtures?date=$(date -u +%Y-%m-%d)" \
            -o data/fixtures.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fixtures.json

          if git diff --cached --quiet; then
            echo "Nema novih podataka."
          else
            git commit -m "Update football data"
            git push
          fi
